<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>PyraHash name card</title>
  <!--
    PyraHash digital name card, hosted on pyrahash.com.
    Reads the slug from ?card=<slug> (or /card/<slug> if your host rewrites
    that path to this file), fetches the card data from the Apps Script
    JSON endpoint, and renders it. All values are inserted with textContent
    or checked URL attributes, never as HTML.

    SETUP: set API_URL below to your Apps Script web app URL (ends in /exec).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Design tokens copied from the pyrahash.com landing page (index.css). */
    :root {
      color-scheme: only light;
      --ph-bg-base:        #07090F;
      --ph-bg-surface:     #0D1120;
      --ph-bg-glass:       rgba(255, 255, 255, 0.04);
      --ph-accent-primary: #00E5FF;
      --ph-accent-violet:  #7C3AED;
      --ph-accent-indigo:  #4F46E5;
      --ph-text-primary:   #F0F4FF;
      --ph-text-secondary: #8892AA;
      --ph-border-subtle:  rgba(255, 255, 255, 0.07);
      --ph-border-accent:  rgba(0, 229, 255, 0.25);
      --ph-glow-cyan:      0 0 24px rgba(0, 229, 255, 0.35);
      --ph-glow-violet:    0 0 24px rgba(124, 58, 237, 0.35);
      /* CARD_COLOR from the sheet can override the accent. */
      --accent: var(--ph-accent-primary);
      --on-accent: #07090F;
      --gradient: linear-gradient(90deg, #00E5FF, #7C3AED);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--ph-text-primary);
      background-color: var(--ph-bg-base);
      /* Dot grid plus soft cyan and violet glows, like the landing page. */
      background-image:
        radial-gradient(600px circle at 10% -10%, rgba(0, 229, 255, 0.14), transparent 60%),
        radial-gradient(600px circle at 110% 110%, rgba(124, 58, 237, 0.18), transparent 60%),
        radial-gradient(circle, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    h1, h2 { font-family: 'Space Grotesk', 'Inter', sans-serif; }
    [hidden] { display: none !important; }

    /* Card: the landing page's glass-card with a gradient top edge. */
    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--ph-bg-glass);
      border: 1px solid var(--ph-border-subtle);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; inset: 0 0 auto 0;
      height: 2px;
      background: var(--gradient);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 20px 0;
    }
    .brand img { height: 28px; width: auto; max-width: 140px; object-fit: contain; }
    .brand span {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: .01em;
    }

    /* Profile */
    .profile { padding: 28px 20px 4px; text-align: center; }
    .avatar {
      width: 112px; height: 112px;
      margin: 0 auto 18px;
      padding: 3px;
      border-radius: 50%;
      background: var(--gradient);
      box-shadow: var(--ph-glow-cyan);
    }
    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--ph-bg-surface);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: 2.1rem; font-weight: 600;
      color: var(--ph-text-primary);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 1.65rem; font-weight: 700; line-height: 1.2; margin: 0 0 6px; overflow-wrap: anywhere; }
    .title {
      margin: 0;
      font-weight: 600;
      overflow-wrap: anywhere;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .dept { margin: 4px 0 0; color: var(--ph-text-secondary); font-size: .95rem; overflow-wrap: anywhere; }

    /* Contact rows */
    .contacts { list-style: none; margin: 22px 0 0; padding: 0 16px; display: grid; gap: 8px; }
    .contacts a {
      display: flex; align-items: center; gap: 14px;
      min-height: 56px; padding: 10px 12px;
      color: var(--ph-text-primary); text-decoration: none;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--ph-border-subtle);
      border-radius: 12px;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .contacts a:hover { border-color: var(--ph-border-accent); box-shadow: var(--ph-glow-cyan); }
    .icon {
      flex: none; width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid var(--ph-border-accent);
      color: var(--accent);
    }
    .icon svg { width: 18px; height: 18px; }
    .label { display: block; font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ph-text-secondary); }
    .value { display: block; overflow-wrap: anywhere; }

    /* Buttons: btn-glow and btn-ghost from the landing page. */
    .actions { display: grid; gap: 10px; padding: 22px 16px 16px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      min-height: 48px; padding: 12px 16px;
      border-radius: 8px; border: 1px solid transparent;
      font: inherit; font-weight: 600; text-decoration: none; text-align: center;
      cursor: pointer;
      transition: box-shadow .2s ease, transform .15s ease, background .2s ease;
    }
    .btn svg { width: 20px; height: 20px; }
    .btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--ph-glow-cyan); }
    .btn-primary:hover { box-shadow: 0 0 40px rgba(0, 229, 255, 0.6); transform: translateY(-1px); }
    .btn-secondary { background: transparent; border-color: var(--ph-border-accent); color: var(--accent); }
    .btn-secondary:hover { background: rgba(0, 229, 255, 0.06); transform: translateY(-1px); }
    .btn-wallet { background: #000000; color: #ffffff; border-color: rgba(255, 255, 255, 0.18); }
    .btn-wallet:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, 0.35); }
    .btn-link {
      justify-self: center;
      min-height: 44px; padding: 10px 4px;
      background: none; color: var(--ph-text-secondary);
      font-weight: 500;
      position: relative;
    }
    .btn-link:hover { color: var(--ph-text-primary); }
    .btn-link::after {
      content: ''; position: absolute; left: 4px; right: 4px; bottom: 8px; height: 2px;
      background: var(--accent); border-radius: 1px;
      transform: scaleX(0); transform-origin: left center; transition: transform .25s ease;
    }
    .btn-link:hover::after { transform: scaleX(1); }

    /* Focus ring, same as the landing page. */
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--ph-accent-primary);
      outline-offset: 3px;
    }

    .status { min-height: 1.5em; margin: 0; padding: 0 20px 18px; font-size: .875rem; color: var(--ph-text-secondary); text-align: center; }
    .status a { color: var(--accent); }

    .message { padding: 32px 24px 28px; text-align: center; }
    .message h1 { margin-top: 4px; }
    .message p { color: var(--ph-text-secondary); }
    .message .actions { padding: 12px 0 0; }

    .skeleton { padding: 28px 20px 36px; text-align: center; }
    .skeleton .avatar { background: rgba(255, 255, 255, 0.06); box-shadow: none; }
    .bar { height: 14px; border-radius: 7px; background: rgba(255, 255, 255, 0.06); margin: 12px auto; }

    /* QR dialog: the code itself stays black on white so every camera reads it. */
    dialog.qr {
      width: min(92vw, 380px);
      max-height: 92vh;
      padding: 22px 20px 20px;
      border: 1px solid var(--ph-border-accent);
      border-radius: 16px;
      background: var(--ph-bg-surface);
      color: var(--ph-text-primary);
      box-shadow: var(--ph-glow-cyan), 0 24px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    dialog.qr::backdrop { background: rgba(7, 9, 15, 0.8); backdrop-filter: blur(4px); }
    dialog.qr h2 { font-size: 1.2rem; margin: 0 0 4px; }
    dialog.qr p { margin: 0; color: var(--ph-text-secondary); font-size: .9rem; }
    .qr-box {
      margin: 18px auto;
      padding: 14px;
      background: #ffffff;
      border-radius: 12px;
      width: fit-content;
      box-shadow: var(--ph-glow-cyan);
    }
    .qr-box canvas { display: block; width: 260px; height: 260px; max-width: 70vw; max-height: 70vw; }
    .segmented {
      display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px;
      padding: 4px; border-radius: 10px;
      border: 1px solid var(--ph-border-subtle);
      background: var(--ph-bg-glass);
      margin-bottom: 14px;
    }
    .segmented button {
      font: inherit; font-weight: 600; font-size: .9rem;
      padding: 8px 16px; border-radius: 7px; border: 0; cursor: pointer;
      background: transparent; color: var(--ph-text-secondary);
    }
    .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
    .qr-close { width: 100%; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .btn:hover { transform: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .skeleton .avatar, .bar { animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .5; } }
      .card { animation: rise .5s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    }
  </style>
</head>
<body>
  <main class="card" aria-busy="true" id="card">
    <header class="brand">
      <img id="logo" alt="" hidden>
      <span id="company">PyraHash</span>
    </header>

    <!-- Loading state -->
    <div class="skeleton" id="loading" role="status" aria-label="Loading name card">
      <div class="avatar"><div class="avatar-inner"></div></div>
      <div class="bar" style="width: 60%;"></div>
      <div class="bar" style="width: 40%;"></div>
    </div>

    <!-- Card -->
    <div id="profile-view" hidden>
      <section class="profile" aria-labelledby="name">
        <div class="avatar"><div class="avatar-inner">
          <img id="photo" alt="" hidden>
          <span id="initials" aria-hidden="true"></span>
        </div></div>
        <h1 id="name"></h1>
        <p class="title" id="title" hidden></p>
        <p class="dept" id="dept" hidden></p>
      </section>

      <ul class="contacts" id="contacts" aria-label="Contact details" hidden>
        <li id="phone-row" hidden>
          <a id="phone-link">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
            </span>
            <span><span class="label">Phone</span><span class="value" id="phone"></span></span>
          </a>
        </li>
        <li id="email-row" hidden>
          <a id="email-link">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
            </span>
            <span><span class="label">Email</span><span class="value" id="email"></span></span>
          </a>
        </li>
        <li id="web-row" hidden>
          <a id="web-link" rel="noopener">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.6 15.6 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4a14 14 0 0 1 1.9 4h-3.8A14 14 0 0 1 12 4zM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4zm.8 2h3a15.6 15.6 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zm3-8h-3a8 8 0 0 1 4.4-3.6A15.6 15.6 0 0 0 8.1 8zM12 20a14 14 0 0 1-1.9-4h3.8A14 14 0 0 1 12 20zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6a15.6 15.6 0 0 0 1.4-3.6h3a8 8 0 0 1-4.4 3.6zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4z"/></svg>
            </span>
            <span><span class="label">Website</span><span class="value" id="website"></span></span>
          </a>
        </li>
      </ul>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="save-contact" aria-describedby="status">Save contact</button>
        <button type="button" class="btn btn-secondary btn-qr" id="show-qr" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm8-2h2v2h-2zm2 2h2v2h-2zm2-2h2v2h-2zm2 2h2v2h-2zm-6 2h2v2h-2zm2 2h2v2h-2zm2-2h2v2h-2zm2 2h2v2h-2z"/></svg>
          Show QR code
        </button>
        <a class="btn btn-wallet" id="wallet" rel="noopener" aria-label="Add this card to Google Wallet" hidden>Add to Wallet</a>
        <a class="btn btn-link company-link" rel="noopener">Visit PyraHash</a>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">
        <span id="fallback" hidden>Download didn't start? <a id="fallback-link">Get the contact file</a>.</span>
        <span id="status-text"></span>
      </p>
    </div>

    <!-- Not found / error -->
    <section class="message" id="message-view" aria-labelledby="msg-title" hidden>
      <h1 id="msg-title"></h1>
      <p id="msg-body"></p>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="retry" hidden>Try again</button>
        <a class="btn btn-secondary company-link" rel="noopener">Visit PyraHash</a>
      </div>
    </section>
  </main>

  <!-- QR code to show a client in person -->
  <dialog class="qr" id="qr-dialog" aria-labelledby="qr-title" aria-describedby="qr-hint">
    <h2 id="qr-title">Scan to save contact</h2>
    <p id="qr-hint">Ask them to point their phone camera at this code.</p>
    <div class="qr-box"><canvas id="qr-canvas" role="img" aria-label="QR code"></canvas></div>
    <div class="segmented" role="group" aria-label="What the QR code contains">
      <button type="button" id="qr-mode-contact" aria-pressed="true">Contact</button>
      <button type="button" id="qr-mode-link" aria-pressed="false">Card link</button>
    </div>
    <button type="button" class="btn btn-secondary qr-close" id="qr-close">Close</button>
  </dialog>

  <script>
    (function () {
      'use strict';

      // ---- Configuration ---------------------------------------------------
      // Your Apps Script web app URL (Deploy > Manage deployments). Ends in /exec.
      var API_URL = 'https://script.google.com/macros/s/AKfycbzXMqYjO8-IFzy5Bji5_JzNnmNrj8ogQnareoahroWvZzRkyPVkGXGrGrBCijHh_JrpQA/exec';
      var DEFAULT_COMPANY_URL = 'https://pyrahash.com';
      var TIMEOUT_MS = 15000;

      var SLUG_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
      var $ = function (id) { return document.getElementById(id); };

      // ---- Read and validate the slug ----------------------------------------
      function getSlug() {
        var fromQuery = new URLSearchParams(location.search).get('card');
        var fromPath = location.pathname.replace(/\/+$/, '').split('/').pop();
        var raw = (fromQuery || (fromPath !== 'card' && fromPath !== 'index.html' ? fromPath : '') || '')
          .trim().toLowerCase();
        return raw.length <= 64 && SLUG_RE.test(raw) ? raw : '';
      }

      // ---- URL and colour checks (the server checks these too) ---------------
      function isHttps(u) { return typeof u === 'string' && /^https:\/\/[^\s"'<>]+$/i.test(u); }
      function isWeb(u) { return typeof u === 'string' && /^https?:\/\/[^\s"'<>]+$/i.test(u); }
      function isHex(c) { return typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c); }

      function show(el, on) { el.hidden = !on; }
      function setText(id, text) { var el = $(id); el.textContent = text || ''; show(el, !!text); }

      function setCompany(data) {
        var name = data.companyName || 'PyraHash';
        var url = isWeb(data.companyUrl) ? data.companyUrl : DEFAULT_COMPANY_URL;
        $('company').textContent = name;
        Array.prototype.forEach.call(document.querySelectorAll('.company-link'), function (a) {
          a.href = url;
          a.textContent = 'Visit ' + name;
        });
        if (isHttps(data.logoUrl)) {
          $('logo').src = data.logoUrl;
          $('logo').alt = name + ' logo';
          show($('logo'), true);
        }
        if (isHex(data.accent)) document.documentElement.style.setProperty('--accent', data.accent);
        if (isHex(data.onAccent)) document.documentElement.style.setProperty('--on-accent', data.onAccent);
      }

      function finish() {
        show($('loading'), false);
        $('card').setAttribute('aria-busy', 'false');
      }

      function showMessage(title, body, canRetry) {
        finish();
        show($('profile-view'), false);
        $('msg-title').textContent = title;
        $('msg-body').textContent = body;
        show($('retry'), canRetry);
        show($('message-view'), true);
        document.title = title + ' | ' + $('company').textContent;
      }

      // ---- Render a found card -----------------------------------------------
      function renderCard(d) {
        finish();
        $('name').textContent = d.name || '';
        setText('title', d.title);
        setText('dept', d.department);
        document.title = (d.name || 'Name card') + ' | ' + $('company').textContent;

        if (isHttps(d.photoUrl)) {
          $('photo').src = d.photoUrl;
          $('photo').alt = 'Photo of ' + d.name;
          show($('photo'), true);
          show($('initials'), false);
        } else {
          $('initials').textContent = d.initials || '';
        }

        var hasPhone = typeof d.phoneHref === 'string' && /^tel:\+?\d+$/.test(d.phoneHref);
        var hasEmail = typeof d.emailHref === 'string' && /^mailto:[^\s<>"]+$/.test(d.emailHref);
        var hasWeb = isWeb(d.website);
        if (hasPhone) { $('phone-link').href = d.phoneHref; $('phone').textContent = d.phone; }
        if (hasEmail) { $('email-link').href = d.emailHref; $('email').textContent = d.email; }
        if (hasWeb) { $('web-link').href = d.website; $('website').textContent = d.websiteLabel || d.website; }
        show($('phone-row'), hasPhone);
        show($('email-row'), hasEmail);
        show($('web-row'), hasWeb);
        show($('contacts'), hasPhone || hasEmail || hasWeb);

        if (typeof d.walletLink === 'string' && d.walletLink.indexOf('https://pay.google.com/gp/v/save/') === 0) {
          $('wallet').href = d.walletLink;
          show($('wallet'), true);
        }
        if (isHttps(d.vcardFallbackUrl)) $('fallback-link').href = d.vcardFallbackUrl;

        $('save-contact').onclick = function () { saveContact(d); };
        $('show-qr').onclick = function () { openQr(d); };
        show($('message-view'), false);
        show($('profile-view'), true);
      }

      // ---- Save contact: build the .vcf in the browser -----------------------
      function saveContact(d) {
        var text = String(d.vcard || '').replace(/\r?\n/g, '\r\n');
        var name = d.vcardFilename || 'contact.vcf';
        try {
          var blob = new Blob([text], { type: 'text/vcard;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
          $('status-text').textContent = 'Contact file ready. Open it to add it to your contacts.';
        } catch (err) {
          $('status-text').textContent = 'Your browser blocked the download.';
        }
        if ($('fallback-link').href) show($('fallback'), true);
      }

      // ---- QR code to show in person -----------------------------------------
      // "Contact" puts the vCard itself in the QR, so the client's camera
      // offers "Add to contacts" straight away (works offline).
      // "Card link" puts this page's URL in the QR instead.
      var qrData = null;

      function drawQr(text) {
        var canvas = $('qr-canvas');
        if (typeof qrcode !== 'function') return;
        qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
        var qr = qrcode(0, 'M');
        qr.addData(text, 'Byte');
        qr.make();
        var count = qr.getModuleCount();
        var cssSize = 260;
        var scale = Math.max(1, Math.floor((cssSize * (window.devicePixelRatio || 1)) / count));
        canvas.width = canvas.height = count * scale;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000000';
        for (var r = 0; r < count; r++) {
          for (var c = 0; c < count; c++) {
            if (qr.isDark(r, c)) ctx.fillRect(c * scale, r * scale, scale, scale);
          }
        }
      }

      function setQrMode(mode) {
        var contact = mode === 'contact';
